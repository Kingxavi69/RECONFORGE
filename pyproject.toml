[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconforge"
version = "0.1.0"
description = "Authorized reconnaissance and attack-surface intelligence tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "dnspython>=2.6.1",
    "jinja2>=3.1.4",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
reconforge = "reconforge.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["reconforge*"]
